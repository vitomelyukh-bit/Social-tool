{% extends "base.html" %}
{% block content %}
<form method="post" class="card" style="max-width:380px;margin:40px auto">
  <h1>Accedi</h1>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autofocus required style="width:100%;padding:9px 10px;border:1px solid var(--bordo);border-radius:7px;font-size:15px">
  <div class="azioni"><button type="submit">Entra</button></div>
</form>
{% endblock %}
